<form [formGroup]="form" (ngSubmit)="onSubmit()" class="general-form app-form">
  <div class="app-form__header">
    <span class="app-form__eyebrow">Organization</span>
    <h2 class="app-form__title">{{ isEditMode ? 'Edit Tag' : 'Create Tag' }}</h2>
    <p class="app-form__description">
      Create a reusable label to organize products inside a specific game catalog.
    </p>
  </div>

  <div class="app-form__grid">
  <div class="form-group">
    <label for="tag-game-id">Game *</label>
    <select id="tag-game-id" name="gameId" formControlName="gameId" class="px-2 py-1">
      <option [ngValue]="null" disabled>Select a game</option>
      @for (game of games(); track game.id) {
      <option [ngValue]="game.id">
        {{ game.name }}
      </option>
      }
    </select>
  </div>

  <div class="form-group">
    <label for="tag-item-group-id">Group</label>
    <select id="tag-item-group-id" name="itemGroupId" formControlName="itemGroupId" class="px-2 py-1">
      <option [ngValue]="null">No group</option>
      @for (itemGroup of itemGroups(); track itemGroup.id) {
      <option [ngValue]="itemGroup.id">
        {{ itemGroup.name }}
      </option>
      }
    </select>
  </div>

  <div class="form-group form-group--full">
    <label for="new-item-group-name">Create a new group</label>
    <div class="item-group-create-row">
      <input
        id="new-item-group-name"
        name="newItemGroupName"
        [formControl]="newItemGroupName"
        maxlength="255"
        class="px-2 py-1"
        placeholder="Group name" />
      <button
        type="button"
        class="button button-small-secondary"
        [disabled]="form.controls.gameId.value === null || newItemGroupName.invalid || isCreatingItemGroup"
        [class.busy-cursor]="isCreatingItemGroup"
        (click)="createItemGroup()">
        {{ isCreatingItemGroup ? 'Creating...' : 'Create group' }}
      </button>
    </div>
    <small>The new group is saved immediately and selected for this tag.</small>
  </div>

  <div class="form-group">
    <label for="tag-name">Name *</label>
    <input
      id="tag-name"
      name="name"
      formControlName="name"
      class="px-2 py-1 w-1/2"
      placeholder="Tag name"
    />
  </div>

  <div class="form-group-row checkbox-group">
    <label>
      <input id="tag-is-active" name="isActive" type="checkbox" formControlName="isActive" />
      Active
    </label>
  </div>

  </div>

  <div class="form-actions">
    <button type="submit" [disabled]="form.invalid || isSubmitting || isCreatingItemGroup" [class.busy-cursor]="isSubmitting || isCreatingItemGroup">
      {{ isSubmitting ? (isEditMode ? 'Saving...' : 'Creating...') : (isEditMode ? 'Save changes' : 'Create tag') }}
    </button>

    <button type="button" class="form-back-button" (click)="cancel()">Back</button>
  </div>
</form>
