apiVersion: batch/v1
kind: Job
metadata:
  name: steamapp-sql-bootstrap
  namespace: steamapp-local
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app: steamapp-sql-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: sql-bootstrap
          image: mcr.microsoft.com/mssql/server:2022-latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: steamapp-local-secret
                  key: MSSQL_SA_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until /opt/mssql-tools18/bin/sqlcmd -S steamapp-sql,1433 -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"; do
                echo "Waiting for SQL Server..."
                sleep 5
              done

              /opt/mssql-tools18/bin/sqlcmd -S steamapp-sql,1433 -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "IF DB_ID(N'SteamAppDb') IS NULL CREATE DATABASE [SteamAppDb];"
