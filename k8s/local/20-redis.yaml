apiVersion: v1
kind: Service
metadata:
  name: steamapp-redis
  namespace: steamapp-local
spec:
  selector:
    app: steamapp-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: steamapp-redis
  namespace: steamapp-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: steamapp-redis
  template:
    metadata:
      labels:
        app: steamapp-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 20
