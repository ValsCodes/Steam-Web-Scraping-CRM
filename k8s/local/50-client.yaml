apiVersion: v1
kind: Service
metadata:
  name: steamapp-client
  namespace: steamapp-local
spec:
  selector:
    app: steamapp-client
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: steamapp-client
  namespace: steamapp-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: steamapp-client
  template:
    metadata:
      labels:
        app: steamapp-client
    spec:
      containers:
        - name: client
          image: steamapp-client:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
