apiVersion: v1
kind: Service
metadata:
  name: steamapp-rabbitmq
  namespace: steamapp-local
spec:
  selector:
    app: steamapp-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: steamapp-rabbitmq
  namespace: steamapp-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: steamapp-rabbitmq
  template:
    metadata:
      labels:
        app: steamapp-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: steamapp-local-secret
                  key: RabbitMq__UserName
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: steamapp-local-secret
                  key: RabbitMq__Password
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 30
            periodSeconds: 20
