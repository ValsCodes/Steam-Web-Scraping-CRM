apiVersion: v1
kind: Service
metadata:
  name: steamapp-webapi
  namespace: steamapp-local
spec:
  selector:
    app: steamapp-webapi
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: steamapp-webapi
  namespace: steamapp-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: steamapp-webapi
  template:
    metadata:
      labels:
        app: steamapp-webapi
    spec:
      containers:
        - name: webapi
          image: steamapp-webapi:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: steamapp-webapi-config
            - secretRef:
                name: steamapp-local-secret
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
